<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Panel admin Sales Order — kelola pesanan, produk, dan performa sales.">
  <meta name="theme-color" content="#183558">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Sales Order Admin">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Sales Order — Admin</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Hilangkan flash putih sebelum Flutter selesai boot. */
    html, body { margin: 0; height: 100%; background: #F8FAFC; }
    #boot-splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 12px;
      font-family: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
      color: #183558; background: #F8FAFC;
    }
    #boot-splash .mark {
      width: 44px; height: 44px; border-radius: 12px; background: #183558;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 800; font-size: 18px;
    }
    #boot-splash .label { font-size: 13px; font-weight: 600; letter-spacing: .2px; }
    #boot-splash .hint { font-size: 12px; color: #64748B; }

    /* Banner "versi baru tersedia" (dibuat oleh script di bawah body). */
    #update-bar {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: max(12px, env(safe-area-inset-bottom));
      max-width: 520px;
      margin: 0 auto;
      z-index: 2147483647;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 8px 8px 14px;
      border-radius: 10px;
      background: #183558;
      color: #FFFFFF;
      font: 600 13px/1.4 "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
      box-shadow: 0 6px 24px rgba(24, 53, 88, .28);
    }
    #update-bar .update-label { flex: 1 1 auto; }
    #update-bar .update-reload {
      flex: 0 0 auto;
      padding: 7px 14px;
      border: 0;
      border-radius: 7px;
      background: #FFFFFF;
      color: #183558;
      font: inherit;
      cursor: pointer;
    }
    #update-bar .update-dismiss {
      flex: 0 0 auto;
      width: 28px;
      height: 28px;
      padding: 0;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: rgba(255, 255, 255, .75);
      font: 400 18px/1 system-ui, sans-serif;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="boot-splash">
    <div class="mark">SO</div>
    <div class="label">Sales Order Admin</div>
    <div class="hint">Memuat panel…</div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization

    URL file ini ditambahi ?v=<buildId> saat deploy oleh
    scripts/stamp_flutter_web.mjs, sehingga build baru = URL baru.
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Splash dibuang setelah frame pertama Flutter tampil (canvas terpasang).
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('boot-splash');
      if (el) el.remove();
    });
  </script>

  <!--
    Deteksi versi baru tanpa memaksa user menghapus cache.

    build-id.json di-generate oleh scripts/stamp_flutter_web.mjs dan selalu
    di-serve dengan Cache-Control: no-cache.

    Sengaja TIDAK auto-reload: dialog/form admin bisa sedang terisi, reload
    paksa bisa menghilangkan input yang belum disimpan. User yang menentukan
    kapan reload lewat tombol, dan boleh menutup banner kalau sedang sibuk.
  -->
  <script>
    (function () {
      var current = null; // build id yang sedang dijalankan halaman ini
      var dismissed = null; // build id yang sudah ditolak user
      var timer = null;

      function stopPolling() {
        if (timer) {
          clearInterval(timer);
          timer = null;
        }
      }

      function startPolling() {
        stopPolling();
        timer = setInterval(checkVersion, 15 * 60 * 1000);
      }

      function showBanner(nextBuild) {
        if (document.getElementById('update-bar')) return;

        var bar = document.createElement('div');
        bar.id = 'update-bar';

        var label = document.createElement('span');
        label.className = 'update-label';
        label.textContent = 'Versi baru tersedia.';

        var reload = document.createElement('button');
        reload.type = 'button';
        reload.className = 'update-reload';
        reload.textContent = 'Muat ulang';
        reload.addEventListener('click', function () {
          location.reload();
        });

        var dismiss = document.createElement('button');
        dismiss.type = 'button';
        dismiss.className = 'update-dismiss';
        dismiss.setAttribute('aria-label', 'Tutup');
        dismiss.textContent = '\u00D7';
        dismiss.addEventListener('click', function () {
          dismissed = nextBuild;
          if (bar.parentNode) bar.parentNode.removeChild(bar);
          startPolling();
        });

        bar.appendChild(label);
        bar.appendChild(reload);
        bar.appendChild(dismiss);
        document.body.appendChild(bar);

        stopPolling();
      }

      function checkVersion() {
        fetch('build-id.json?t=' + Date.now(), { cache: 'no-store' })
          .then(function (res) {
            return res.ok ? res.text() : null;
          })
          .then(function (body) {
            if (!body) return;
            if (current === null) {
              current = body;
              return;
            }
            if (body === current || body === dismissed) return;
            showBanner(body);
          })
          .catch(function () {
            /* offline atau build-id.json belum ada: abaikan */
          });
      }

      checkVersion();
      startPolling();
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') checkVersion();
      });
    })();
  </script>
</body>
</html>
