# Render Blueprint — declarative deployment config
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: sales-api
    runtime: docker
    rootDir: sales-app/backend
    dockerfilePath: ./Dockerfile
    region: singapore
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false  # Set via Render dashboard → Environment tab
      - key: SECRET_KEY
        sync: false  # Set via Render dashboard → Environment tab
      - key: CORS_ORIGINS
        # Ganti dengan origin admin web & mobile app kamu. Pisahkan dengan koma.
        value: https://your-admin-web-url.onrender.com
      - key: SEED_DEMO_USERS
        value: "false"
      - key: RUN_SCHEDULER
        value: "true"
