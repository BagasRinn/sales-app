<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Sales Web App - Mobile layout for browser">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sales App">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Theme color -->
  <meta name="theme-color" content="#0175C2">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Sales App</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #F4F7FB;
    }
  </style>
</head>
<body>
  <script>
    // Cache bust: ubah angka ini setiap kali deploy, atau otomatis dengan build timestamp
    var _cb = Date.now();
  </script>
  <script>
    // Inject cache-bust query param ke flutter_bootstrap.js DAN main.dart.js
    window.addEventListener('load', function() {
      [].forEach.call(document.querySelectorAll('script[src]'), function(s) {
        var src = s.getAttribute('src');
        if (src && !src.includes('?v=')) {
          s.setAttribute('src', src + (src.includes('?') ? '&' : '?') + 'v=' + window._cb);
        }
      });
      // Also bust for flutter assets link
      var links = document.querySelectorAll('link[rel="preload"][as="script"]');
      links.forEach(function(l) {
        var href = l.getAttribute('href');
        if (href && !href.includes('?v=')) {
          l.setAttribute('href', href + (href.includes('?') ? '&' : '?') + 'v=' + window._cb);
        }
      });
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
