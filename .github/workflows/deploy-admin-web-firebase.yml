name: Deploy Admin Web to Firebase

on:
  push:
    branches: [main]
    paths:
      - 'sales-app/admin_web/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@d6a63d5b4e0e5caa1eba98d5a46e0f0e2e47c6ac
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
          cache: true
          cache-dependency-path: sales-app/admin_web/pubspec.lock

      - name: Setup Flutter
        run: |
          flutter config --enable-web
          flutter pub get
        working-directory: sales-app/admin_web

      - name: Build Flutter Web
        run: flutter build web --release
        working-directory: sales-app/admin_web

      - name: Deploy to Firebase
        run: |
          npm install -g firebase-tools@13
          firebase deploy --only hosting --token=${{ secrets.FIREBASE_TOKEN }}
        working-directory: sales-app/admin_web
