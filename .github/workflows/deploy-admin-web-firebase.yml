name: Deploy Admin Web to Firebase

on:
  push:
    branches: [main]
    paths:
      - 'sales-app/admin_web/**'
      - 'scripts/**'
      - '.github/workflows/deploy-admin-web-firebase.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'
          cache: true

      - name: Setup Flutter
        run: |
          flutter config --enable-web
          flutter pub get
        working-directory: sales-app/admin_web

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Flutter Web
        run: flutter build web --release
        working-directory: sales-app/admin_web

      # Menambahkan ?v=<buildId> ke flutter_bootstrap.js & main.dart.js supaya
      # browser tidak pernah memakai bundle lama walau cache-nya 1 tahun.
      - name: Stamp build id (cache busting)
        env:
          BUILD_ID: run${{ github.run_number }}-${{ github.sha }}
        run: node scripts/stamp_flutter_web.mjs sales-app/admin_web/build/web

      - name: Deploy to Firebase
        run: |
          npm install -g firebase-tools@15
          firebase deploy --only hosting:sales-admin-web --token=${{ secrets.FIREBASE_TOKEN }}
        working-directory: sales-app/admin_web
