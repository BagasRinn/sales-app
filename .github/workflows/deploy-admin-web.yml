name: Deploy Admin Web to Vercel

on:
  push:
    branches: [main]
    paths:
      - 'sales-app/admin_web/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@d6a63d5b4e0e5caa1eba98d5a46e0f0e2e47c6ac
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
          cache: true
          cache-dependency-path: sales-app/admin_web/pubspec.lock

      - name: Setup Flutter
        run: |
          flutter config --enable-web
          flutter pub get
        working-directory: sales-app/admin_web

      - name: Build Flutter Web
        run: flutter build web --release
        working-directory: sales-app/admin_web

      - name: Deploy to Vercel
        run: |
          npm install -g vercel@37
          vercel --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        working-directory: sales-app/admin_web/build/web
