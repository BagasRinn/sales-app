name: Deploy Sales Web to Firebase

on:
  push:
    branches: [main]
    paths:
      - 'sales-app/sales_web/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'
          cache: true

      - name: Setup Flutter
        run: |
          flutter config --enable-web
          flutter pub get
        working-directory: sales-app/sales_web

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Flutter Web
        run: flutter build web --release
        working-directory: sales-app/sales_web

      - name: Deploy to Firebase
        run: |
          npm install -g firebase-tools@15
          firebase deploy --only hosting:sales-order-web --token=${{ secrets.FIREBASE_TOKEN }}
        working-directory: sales-app/sales_web
